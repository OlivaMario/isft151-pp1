name: Despliegue
on:
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
    pages: write
    id-token: write
jobs:
    despliegue:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.publicacion.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: frontend
            - id: publicacion
              uses: actions/deploy-pages@v4
